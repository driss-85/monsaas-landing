name: Deploy to GitHub Pages

# Build le site Vite et le publie sur GitHub Pages a chaque push sur main.
# Prerequis (une seule fois) : Settings > Pages > Build and deployment >
# Source = "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule execution a la fois, sans annuler un deploiement en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Force la source Pages sur "GitHub Actions" (build_type workflow).
      # Sans ca, si le repo est en "Deploy from a branch", GitHub sert les
      # fichiers source bruts (index.html qui pointe vers /src/main.tsx) et
      # la page reste blanche. enablement:true bascule la config via l'API.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
